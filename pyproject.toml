[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "django-esm"
readme = "README.md"
keywords = [ "Django", "ESM", "importmap", "JavaScript", "module" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [
  "django>=5.2.13",
  "servestatic>=4.3.4",
]
# deprecated no-op alias; servestatic is a hard dependency
optional-dependencies.whitenoise = []
urls.Changelog = "https://github.com/codingjoe/django-esm/releases"
urls.Documentation = "https://github.com/codingjoe/django-esm#django-esm"
urls.Issue-Tracker = "https://github.com/codingjoe/django-esm/issues"
urls.Project-URL = "https://github.com/codingjoe/django-esm"
urls.Source = "https://github.com/codingjoe/django-esm"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "django_esm/_version.py"

[tool.flit]
module.name = "django_esm"

[tool.ruff]
src = [ "crontask", "tests" ]
lint.select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [ "B904", "D1", "E501", "S101" ]
lint.per-file-ignores."tests/**/*.py" = [
  "S",
]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --tb=short -rxs"
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "django_esm" ]
report.omit = [ "django_esm/_version.py", "tests/*" ]
report.show_missing = true
