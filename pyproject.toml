[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.12", "flit-scm", "wheel" ]

[project]
name = "django-esm"
readme = "README.md"
keywords = [ "Django", "ESM", "importmap", "JavaScript", "module" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [
  "django>=5.2.13",
  "servestatic>=4.3.4",
]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.optional-dependencies]
# deprecated no-op alias; servestatic is a hard dependency
whitenoise = []
[project.urls]
Changelog = "https://github.com/codingjoe/django-esm/releases"
Documentation = "https://github.com/codingjoe/django-esm#django-esm"
Issue-Tracker = "https://github.com/codingjoe/django-esm/issues"
Project-URL = "https://github.com/codingjoe/django-esm"
Source = "https://github.com/codingjoe/django-esm"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "django_esm/_version.py"

[tool.flit]
[tool.flit.module]
name = "django_esm"

[tool.ruff]
src = [ "crontask", "tests" ]
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**/*.py" = [
  "S",
]
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "pep257"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]
addopts = "--cov --tb=short -rxs"
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "django_esm" ]
[tool.coverage.report]
omit = [ "django_esm/_version.py", "tests/*" ]
show_missing = true
